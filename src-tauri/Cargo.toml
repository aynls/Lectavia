[package]
name = "lectavia"
version = "0.1.0"
description = "Turn videos into study material."
license = "MIT"
edition = "2024"

[lib]
name = "lectavia_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs"] }
tauri-plugin-opener = "2"
