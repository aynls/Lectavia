[package]
name = "lectavia"
version = "0.1.0"
description = "Transcribe and organize videos into editable documents."
license = "MIT"
edition = "2024"
default-run = "lectavia"

[[bin]]
name = "lectavia"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "lectavia-mcp"
path = "src/bin/lectavia-mcp.rs"
required-features = ["mcp"]

[lib]
name = "lectavia_lib"
crate-type = ["rlib"]

[features]
default = ["desktop", "mcp"]
mcp = ["dep:rmcp", "dep:schemars", "dep:interprocess", "tokio/time"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:ashpd", "tokio/time", "dep:axum", "dep:tauri-plugin-clipboard-manager", "dep:widestring", "dep:uuid", "dep:tokio-util", "rmcp?/transport-streamable-http-server"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
dirs = "7"
interprocess = { version = "2.4", features = ["tokio"], optional = true }
rmcp = { version = "3.11", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
schemars = { version = "1", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-clipboard-manager = { version = "2.5", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync"] }
tokio-util = { version = "0.7", optional = true, features = ["rt"] }
tauri-plugin-opener = { version = "2", optional = true }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
widestring = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri"], optional = true }
